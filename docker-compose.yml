services:
  octopus:
    image: ghcr.io/seller-1990/octopus:${OCTOPUS_IMAGE_TAG:-latest}
    ports:
       # 默认只映射到本机回环（外部不可达）；公网部署显式改为 0.0.0.0:8080 并加防火墙
       - '127.0.0.1:8080:8080'
    volumes:
       - octopus-data:/app/data
    environment:
       - OCTOPUS_DATA_DIR=/app/data
       # F01 修复：容器内必须绑定 0.0.0.0（绑定 127.0.0.1 会使端口映射失效）；
       # 暴露面由 compose 端口映射（默认本机回环）收敛
       - OCTOPUS_SERVER_HOST=0.0.0.0
       # 首次启动 bootstrap 密码（空库时必填，否则拒绝启动）。首次登录后建议立即改密。
       # - OCTOPUS_BOOTSTRAP_PASSWORD=change-me
    container_name: octopus
    restart: unless-stopped
    # 停机链路预算：HTTP drain(≤8s) + 统计/日志 flush(≤20s) 需要超出 docker
    # 默认 10s 宽限的时间窗，否则 SIGKILL 会截断尾部写者（统计/日志丢失）。
    stop_grace_period: 40s

volumes:
  octopus-data:
