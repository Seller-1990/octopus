name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare embedded static directory
        run: |
          mkdir -p static/out
          touch static/out/.keep

      - name: Test
        run: go test ./...

      - name: Test server packages with race detector
        run: go test -race ./internal/server/... -count=1 -timeout 300s

      - name: Test price update script
        run: python3 -B -m unittest discover -s scripts -p 'test_update_price.py' -v

  verification-bridge:
    name: verification-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test extension scripts
        run: node --test extensions/verification-bridge/background.test.js extensions/verification-bridge/bridge-common.test.js

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # F10：类型检查与 Node 单测必须成为提交门禁，否则类型错误或
      # 状态 helper 回归可以在 CI 绿灯下合入。
      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Node unit tests
        run: |
          node --experimental-strip-types --test \
            src/api/session-guard.test.mjs \
            src/api/live-logs-merge.test.mjs \
            src/api/endpoints/site-query-keys.test.mjs \
            src/components/modules/group/member-sort.test.mjs \
            src/components/modules/site/batch-failure.test.mjs \
            src/components/modules/site/checkin-status.test.mjs \
            src/components/modules/site/site-message.test.mjs
